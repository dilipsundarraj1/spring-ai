plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

group = 'com.llm'
version = '0.0.1-SNAPSHOT'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    //openai
    implementation("org.springframework.ai:spring-ai-starter-model-openai")

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    //otel
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    //otel-metrics
    implementation 'org.springframework.boot:spring-boot-starter-aop:4.0.0-M2'
    //otel-logs
    implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:2.21.0-alpha'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4 moved @WebMvcTest / MockMvc auto-configuration into the webmvc test starter
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
    dependencies {
        // Force incubator version to match opentelemetry-sdk:1.62.0 managed by Boot 4.1.0
        dependency 'io.opentelemetry:opentelemetry-api-incubator:1.62.0-alpha'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}